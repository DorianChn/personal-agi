name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv run python -m compileall scripts src app
      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -v
      - name: Exercise sample-data pipeline
        run: |
          uv run python scripts/make_sample_data.py
          uv run python scripts/clean.py --input data/processed/train.jsonl --output data/ci-cleaned --format jsonl
          uv run python -c "import json; from pathlib import Path; p=Path('data/ci-cleaned/train.jsonl'); rows=[json.loads(line) for line in p.read_text(encoding='utf-8').splitlines() if line]; assert rows and all({'instruction','input','output'} <= set(row) for row in rows)"
