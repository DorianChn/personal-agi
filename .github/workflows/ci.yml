name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv run python -m compileall scripts src app
      - run: uv run python scripts/make_sample_data.py && uv run python scripts/clean.py --input data/raw --output data/processed || true
