# Personal AGI 配置文件

# ============ 基座模型 ============
base_model:
  # 云端训练使用的 HuggingFace 基座（Qwen3.5-9B 系列）
  hf_id: "Qwen/Qwen3.5-9B"          # 如官方权重名称不同，请替换
  # 本地推理使用的 Ollama 模型名
  ollama_base: "qwen3.5:9b"

# ============ 本地训练（8GB 显存，transformers+peft）============
local_training:
  # 本地可训的基座（8GB 显存范围）
  models:
    - "Qwen/Qwen3-0.6B"
    - "Qwen/Qwen3-1.7B"
  # 脚本：scripts/train_local.py

# ============ 训练参数（云端 QLoRA）============
training:
  output_dir: "./outputs"            # 训练产物输出目录
  num_epochs: 3                      # 训练轮数
  per_device_train_batch_size: 2     # 单卡 batch size
  gradient_accumulation_steps: 4     # 梯度累积
  learning_rate: 2e-4                # 学习率
  lr_scheduler: "cosine"             # 学习率调度
  warmup_ratio: 0.05
  max_seq_length: 2048               # 最大序列长度
  lora_r: 16                         # LoRA rank
  lora_alpha: 32                     # LoRA alpha
  lora_dropout: 0.05
  use_4bit: true                     # 4bit 量化加载（QLoRA）
  bnb_4bit_compute_dtype: "float16"
  logging_steps: 10
  save_steps: 200
  eval_strategy: "steps"
  eval_steps: 200
  save_total_limit: 2
  # 数据集（相对项目根目录）
  train_file: "data/processed/train.jsonl"
  eval_file: "data/processed/eval.jsonl"

# ============ 量化参数 ============
quantization:
  # GGUF 量化类型，可选：q4_k_m, q5_k_m, q8_0, f16
  quant_type: "q4_k_m"
  output_dir: "./outputs/gguf"

# ============ 推理 / 部署 ============
inference:
  backend: "ollama"                  # ollama | openai
  ollama:
    host: "http://localhost:11434"
    model: "personal-agi-9b"         # 微调后导入的模型名
  openai:
    base_url: "http://localhost:8000/v1"
    model: "personal-agi-9b"
    api_key: "EMPTY"                 # 本地服务可留空

# ============ 生成参数 ============
generation:
  temperature: 0.7
  top_p: 0.9
  max_tokens: 1024

# ============ RAG（可选）============
rag:
  embedding_model: "bge-m3"
  collection_name: "personal_knowledge"
  top_k: 4
