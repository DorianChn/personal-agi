[project]
name = "personal-agi"
version = "0.1.0"
description = "个人专属 9B 模型的训练与部署全流程"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # 推理 / 界面（本地）
    "requests>=2.31",
    "pyyaml>=6.0",
    "streamlit>=1.36",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[dependency-groups]
train = [
    # 云端训练依赖（AutoDL 上安装）
    "torch",
    "unsloth[cu121-ampere-torch240]",
    "trl",
    "peft",
    "datasets",
    "accelerate",
    "bitsandbytes",
    "xformers",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
